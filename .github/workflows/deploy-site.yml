name: Publish site

# Publishes the site/ folder to GitHub Pages on every push to main that
# touches it, and after each weekly data update.

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_run:
    workflows: ['Weekly data update']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare files
        run: |
          mkdir -p _site
          rsync -a --exclude build --exclude README.md site/ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
