      - generic [ref=f44e287]:
        - 'heading "02 Geography: where the money sits" [level=2] [ref=f44e288]':
          - generic [ref=f44e289]: "02"
          - text: "Geography: where the money sits"
        - paragraph [ref=f44e290]: How the measured corporate revenue and profit distribute across countries and regions, and how far that map deviates from a map of world GDP.
        - heading "What the data shows" [level=3] [ref=f44e291]
        - list [ref=f44e292]:
          - listitem [ref=f44e293]: Country size tracks corporate size, but loosely. Across the 60 countries Forbes covers, the correlation between a country's share of world GDP and its share of Global-2000 revenue is ρ = 0.87 (p = <0.001).
          - listitem [ref=f44e294]: Mixing in the Fortune 500, the Wikipedia country lists and the listed universe *raises* that correlation to ρ = 0.85 (p = <0.001) -- the Forbes list alone was distorting the map, and mixing the sources repairs part of the distortion.
          - listitem [ref=f44e295]: "National concentration is extreme. One country holds 36.9% of the revenue in Forbes' list, the top five hold 68.0% and the top ten 82.1%. National HHI on revenue is 1734 points (mixed view: 1647)."
          - listitem [ref=f44e296]: 23 countries appear in the mixed view with no representative at all in Forbes' 2,000, together worth $770B. The largest such gaps are Russian Federation ($542B), Turks and Caicos Islands ($81B), New Zealand ($61B), Nigeria ($38B), Iceland ($12B).
