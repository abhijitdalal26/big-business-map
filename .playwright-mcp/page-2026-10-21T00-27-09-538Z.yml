        - 'heading "04 Ownership: who owns it" [level=2] [ref=f44e2131]':
          - generic [ref=f44e2132]: "04"
          - text: "Ownership: who owns it"
        - paragraph [ref=f44e2133]: State, listed, private, mutual and subsidiary capital, and the large firms that no ranking list puts on the page.
        - heading "What the data shows" [level=3] [ref=f44e2134]
        - list [ref=f44e2135]:
          - listitem [ref=f44e2136]: State-owned enterprises account for 56 companies and $4.05 T$ of revenue in the mixed universe -- 4.1% of everything measured, and a profit share of only 2.4%.
          - listitem [ref=f44e2137]: The invisible giants. 11,030 companies with known revenue do not appear in the Forbes Global 2000, worth $46.81 T$ between them. 186 of them exceed $50B in revenue -- including AMAZON.COM, INC. ($717B, public), State Grid ($555B, state), UnitedHealth Group Incorporated ($448B, public), Saudi Aramco ($446B, public).
          - listitem [ref=f44e2138]: Re-ranking the top 100 on earth from the mixed universe, 60 of Forbes' own top 100 are displaced, and the true top 100 is worth $23.95 T$ against Forbes' $15.48 T$ (a $8475B gap).
          - listitem [ref=f44e2139]: "state vs listed: median net margin 2.0% vs 9.8% (means 3.1% vs 12.0%; difference in means -8.9 pp, bootstrap CI [-10.3, -7.5] pp, p = <0.001)."
          - listitem [ref=f44e2140]: "state vs private/PE: median net margin 2.0% vs 1.0% (means 3.1% vs 2.3%; difference in means +0.8 pp, bootstrap CI [-0.9, +2.6] pp, p = 0.360)."
          - listitem [ref=f44e2141]: "mutual vs listed: median net margin 3.7% vs 9.8% (means 5.3% vs 12.0%; difference in means -6.7 pp, bootstrap CI [-9.2, -3.9] pp, p = <0.001)."
          - listitem [ref=f44e2142]: 42 rows were dropped from the margin comparison because a net margin outside [-100%, +100%] is arithmetically impossible for a standalone operating business.
