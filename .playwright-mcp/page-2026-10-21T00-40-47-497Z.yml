        - 'heading "07 Time series: how the picture changed" [level=2] [ref=f48e6460]':
          - generic [ref=f48e6461]: "07"
          - text: "Time series: how the picture changed"
        - paragraph [ref=f48e6462]: "The tracked cohort across years: revenue and profit paths, where the profit pool moved, and which firms climbed."
        - heading "What the data shows" [level=3] [ref=f48e6463]
        - list [ref=f48e6464]:
          - listitem [ref=f48e6465]: "Constant cohort: 1,287 firms, 2015–2024. Aggregate revenue grew from $29.34T to $45.22T — ×1.54, a CAGR of 4.9% (95% CI 3.3–4.9%)."
          - listitem [ref=f48e6466]: Profit outran revenue. Over the same window the cohort's profit pool grew ×1.95 against revenue ×1.54 — so the blended margin widened, not narrowed.
          - listitem [ref=f48e6467]: "The profit pool migrated. Biggest share gainers: Oil & Gas Operations (+7.5pp), IT Software & Services (+4.0pp), Materials (+3.9pp), Semiconductors (+1.4pp), Retail and Wholesale (+1.2pp)."
          - listitem [ref=f48e6468]: "Biggest share losers: Banking (-5.3pp), Consumer Durables (-2.9pp), Drugs & Biotechnology (-2.8pp), Telecommunications Services (-2.5pp), Food, Drink & Tobacco (-1.6pp)."
          - listitem [ref=f48e6469]: The top of the table is sticky but not static. Of the top 100 in 2015, 67 are still there today; of the top 500, 382 remain (76.4%).
          - listitem [ref=f48e6470]: Of 1,287 current Forbes firms with a full history, 15% shrank over the decade (median growth +51.8%).
