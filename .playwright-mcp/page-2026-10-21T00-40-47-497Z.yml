          - listitem [ref=f48e11481]: "{'topic': \"Fortune's company_type mislabels state firms\", 'detail': \"Fortune reports several Chinese state enterprises as 'Private'. Ownership for 104 names was hand-labelled in data/fortune_labels.csv and applied here.\"}"
          - listitem [ref=f48e11482]: "{'topic': 'Exchange market caps are not world market cap', 'detail': 'The 60 exchanges cover ~148T USD, but listed domestic companies number ~48,000 worldwide, so this is a coverage figure, not a total.'}"
          - listitem [ref=f48e11483]: "{'topic': 'Unicorn valuations are marks, not prices', 'detail': 'Private valuations are the price of the most recent round, usually preferred stock with a preference. They are not realisable and not comparable to market capitalisation.'}"
          - listitem [ref=f48e11484]: "{'topic': 'The listed universe is US-complete and world-partial', 'detail': '5,500 US names carry SEC XBRL revenue; the rest carry a market-cap-site estimate. Country counts measure coverage, not corporate density.'}"
          - listitem [ref=f48e11485]: "{'topic': 'Market-value snapshots come from different dates', 'detail': 'Forbes values are May 2025; the scraped Fortune profiles are dated 2026. They are never plotted on the same axis.'}"
