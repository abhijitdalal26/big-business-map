    - main [ref=f5e54]:
      - generic [ref=f5e55]: Three ledgers, not one. The Forbes list measures revenue. The listed universe measures market value. The unicorn board measures private paper valuation. They cover different companies and different years, so they must never be added together or compared as shares of a single pie. Market value is a point-in-time measure and is not additive with revenue; country is the domicile of the company, not the nationality of its owners.
      - generic [ref=f5e56]:
        - 'heading "01 Scale: the size of the measured corporate world" [level=2] [ref=f5e57]':
          - generic [ref=f5e58]: "01"
          - text: "Scale: the size of the measured corporate world"
        - paragraph [ref=f5e59]: How much revenue, profit, assets and workforce the reconciled universe of large firms actually represents, and how steeply that value is concentrated.
        - heading "Key numbers" [level=3] [ref=f5e60]
