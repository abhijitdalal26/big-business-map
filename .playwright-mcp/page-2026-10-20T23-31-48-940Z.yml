        - 'heading "08 Data quality: how far to trust the above" [level=2] [ref=f5e7799]':
          - generic [ref=f5e7800]: "08"
          - text: "Data quality: how far to trust the above"
        - paragraph [ref=f5e7801]: Where fields are empty, where two sources disagree, how old each dataset is, and the caveats that apply to every number in this pack.
        - heading "What the data shows" [level=3] [ref=f5e7802]
        - list [ref=f5e7803]:
          - listitem [ref=f5e7804]: Forbes vs SEC filings. Across 1,453 companies in both, revenue differs by a median of 10.1%; 50% agree to within 10% and 9% differ by more than 2×.
          - listitem [ref=f5e7805]: Forbes vs Wikipedia country lists. Across 549 shared companies the median revenue gap is 7.1% and 77% land within 25% — the Wikipedia top-up is usable, but it is a third-tier source and is labelled as such.
          - listitem [ref=f5e7806]: "Completeness is uneven. Densest gaps: wiki_countries (46% of cells empty, worst column `ownership`), ai_companies (39% of cells empty, worst column `total_funding_usd`), ai_labs (34% of cells empty, worst column `parent`)."
          - listitem [ref=f5e7807]: Every company carries a confidence score (median 0.60, 10th percentile 0.40), derived from source trust, how many independent lists corroborate the company, and field completeness.
          - listitem [ref=f5e7808]: The Wikipedia top-up mostly finds companies Forbes missed. 527 of its 1,076 companies are absent from the Forbes 2,000 — which is precisely the coverage gap the reconciled ranking is built to close.
          - listitem [ref=f5e7809]: Read the caveats panel before quoting any single number. Revenue is a flow, not value added; valuations are marks, not prices; and the vintage of every series differs.
