        - 'heading "06 Private capital: the part without a ticker" [level=2] [ref=f47e5475]':
          - generic [ref=f47e5476]: "06"
          - text: "Private capital: the part without a ticker"
        - paragraph [ref=f47e5477]: "The private half of the economy: unicorn valuations, the largest unlisted operating companies, and the frontier-lab landscape."
        - heading "What the data shows" [level=3] [ref=f47e5478]
        - list [ref=f47e5479]:
          - listitem [ref=f47e5480]: "The private tail is enormous and unusually concentrated: 1,442 unicorns carry 7.35 T$ of paper value across 55 countries, but the top country holds 69% of it and the top five 90% (HHI 4937). The median unicorn is worth $1.7B; the mean is 3.0x the median."
          - listitem [ref=f47e5481]: 662 companies with measurable revenue have no listed share at all, worth 17.52 T$ — real revenue, not paper. private accounts for $5285B across 236 firms; unknown accounts for $5175B across 324 firms; state accounts for $3685B across 51 firms.
          - listitem [ref=f47e5482]: "Among 173 AI model builders, 45 ship open weights, 24 are partial and 104 are closed. At the frontier specifically (27 labs) the split is {'no': 12, 'partial': 8, 'yes': 7} by country {'China': 9, 'United States': 8, 'South Korea': 4, 'Russia': 2, 'United Kingdom': 1, 'Germany': 1, 'France': 1, 'India': 1} — openness is a regional strategy, not a universal one."
          - listitem [ref=f47e5483]: Keep the ledgers separate. The Forbes 2,000 report $52.9 T$ of *revenue*; the listed universe reports $150.5 T$ of *market value*; the unicorn board reports $7.35 T$ of *paper marks* — equal to 4.9% of the listed market. These three numbers measure different things and must never be summed.
          - listitem [ref=f47e5484]: "The unicorn board overlaps the public world more than its reputation suggests: 19 of 1,442 unicorn names also appear in the reconciled universe. A $1B+ private mark from an old round is not a current price."
