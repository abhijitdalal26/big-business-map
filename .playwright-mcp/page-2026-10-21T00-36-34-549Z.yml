    - main [ref=f47e55]:
      - generic [ref=f47e56]: Three ledgers, not one. The Forbes list measures revenue. The listed universe measures market value. The unicorn board measures private paper valuation. They cover different companies and different years, so they must never be added together or compared as shares of a single pie. Market value is a point-in-time measure and is not additive with revenue; country is the domicile of the company, not the nationality of its owners.
      - generic [ref=f47e57]:
        - 'heading "01 Scale: the size of the measured corporate world" [level=2] [ref=f47e58]':
