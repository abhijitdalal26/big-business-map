      - generic [ref=f3e3274]:
        - 'heading "05 Capital: what the markets think it is worth" [level=2] [ref=f3e3275]':
          - generic [ref=f3e3276]: "05"
          - text: "Capital: what the markets think it is worth"
        - paragraph [ref=f3e3277]: "The listed universe: market value, sector multiples, the gap between where profit sits and where valuation sits, and how deep each national equity market is against its GDP."
        - heading "What the data shows" [level=3] [ref=f3e3278]
        - list [ref=f3e3279]:
          - listitem [ref=f3e3280]: "The listed universe we can measure holds 10,076 companies worth $150.5 T$. That is extraordinarily concentrated: the top 10 hold 20.2%, the top 100 42.9%, and it takes only 169 companies to reach half the total. HHI 59, Gini 0.86."
          - listitem [ref=f3e3281]: The median listed company is worth $1830.5M while the average is $14935.3M -- a 8x gap. The top 1,000 firms (9.9% of the universe) alone hold 78.5% of all measured market value.
          - listitem [ref=f3e3282]: "Financial depth varies by an order of magnitude. Among economies large enough to host a real equity market (economy with GDP >= $100B and >= 5 listed companies), the deepest market is 3.17x GDP (Switzerland) and the shallowest 0.12x (Pakistan). (26 micro-states (Bahamas, Bahrain, Bermuda, Bulgaria, Cambodia, Cayman Islands...) are excluded: they host a handful of multinational registrations, not a genuine domestic market.)"
          - listitem [ref=f3e3283]: Market value scales with revenue with an elasticity of 0.63 (95% CI [0.62, 0.64], p = <0.001; n = 9,609). Because the elasticity is below 1, doubling revenue multiplies market value by about 1.54x, not 2x -- scale by itself does not earn a higher valuation multiple, because the price-to-sales multiple shrinks as revenue grows.
          - listitem [ref=f3e3284]: Profit and market value disagree about which businesses matter. Financials earns 34.1% of profit but is only 20.6% of market value; Energy & Utilities earns 11.3% of profit but is only 8.7% of market value. Conversely Technology (-10.1 pp); Consumer & Retail (-2.8 pp); Healthcare (-2.4 pp).
