          - text: "Geography: where the money sits"
        - paragraph [ref=f42e286]: How the measured corporate revenue and profit distribute across countries and regions, and how far that map deviates from a map of world GDP.
        - heading "What the data shows" [level=3] [ref=f42e287]
        - list [ref=f42e288]:
          - listitem [ref=f42e289]: Country size tracks corporate size, but loosely. Across the 60 countries Forbes covers, the correlation between a country's share of world GDP and its share of Global-2000 revenue is ρ = 0.87 (p = <0.001).
          - listitem [ref=f42e290]: Mixing in the Fortune 500, the Wikipedia country lists and the listed universe *raises* that correlation to ρ = 0.85 (p = <0.001) -- the Forbes list alone was distorting the map, and mixing the sources repairs part of the distortion.
          - listitem [ref=f42e291]: "National concentration is extreme. One country holds 36.9% of the revenue in Forbes' list, the top five hold 68.0% and the top ten 82.1%. National HHI on revenue is 1734 points (mixed view: 1647)."
          - listitem [ref=f42e292]: 23 countries appear in the mixed view with no representative at all in Forbes' 2,000, together worth $770B. The largest such gaps are Russian Federation ($542B), Turks and Caicos Islands ($81B), New Zealand ($61B), Nigeria ($38B), Iceland ($12B).
