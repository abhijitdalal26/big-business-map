      - generic [ref=f42e1547]:
        - 'heading "03 Industry: what the money does" [level=2] [ref=f42e1548]':
          - generic [ref=f42e1549]: "03"
          - text: "Industry: what the money does"
        - paragraph [ref=f42e1550]: Which sectors carry the revenue, which carry the profit, and how wide the margin distributions are inside each sector.
        - heading "What the data shows" [level=3] [ref=f42e1551]
        - list [ref=f42e1552]:
          - listitem [ref=f42e1553]: Profit is pooled far more unevenly than revenue. Financials takes 34.0% ($1661B); Technology takes 16.7% ($815B); Energy & Utilities takes 11.2% ($550B); Consumer & Retail takes 10.7% ($522B); Healthcare takes 5.3% ($258B).
          - listitem [ref=f42e1554]: "ROA is exactly margin x turnover (largest identity error 6.94e-18), and it splits the map in two. Margin-driven sectors: Technology, Healthcare, Industrials & Defense, Transport & Logistics. Turnover-driven sectors: Consumer & Retail, Food & Agriculture, Materials & Chemicals."
          - listitem [ref=f42e1555]: "Productivity per employee spans four orders of magnitude: the median firm earns $0.6M per head, the 99th percentile $2M, and the top firm 915x the median."
          - listitem [ref=f42e1556]: Conglomerates has the highest rate of loss-making firms (25% of 8 firms), while Financials has the highest median net margin (15.5%).
          - listitem [ref=f42e1557]: Does being bigger make you more profitable? Controlling for sector, a 1% larger revenue base is associated with -0.036 pp higher net margin (p = <0.001, significant; n = 1,981).
