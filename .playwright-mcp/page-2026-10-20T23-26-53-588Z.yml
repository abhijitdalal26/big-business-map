        - heading "What the data shows" [level=3] [ref=f4e86]
        - list [ref=f4e87]:
          - listitem [ref=f4e88]: Forbes' Global 2000 holds 52.88 T$ of revenue across 2,000 firms, 9.2% of which is profit. 128 firms (6.4%) lose money.
          - listitem [ref=f4e89]: "Concentration is steep but not a monopoly: the top 100 firms hold 35.4% of revenue, the top 500 hold 70.7%, and it takes 208 firms to reach half the total. HHI on revenue is 21 points and the Gini is 0.61."
          - listitem [ref=f4e90]: The rank-size curve fits a power law with a Zipf exponent of 0.87 (R² = 0.547), i.e. roughly Zipf-like, so firm size decays smoothly rather than through a single dominant tier.
          - listitem [ref=f4e91]: The list is truncated, and it matters. Merging the 2,000 Forbes firms with the 11,836 listed companies we can measure individually adds 28.89 T$ of revenue that the Global 2000 never mentions — 24.0% of everything measurable. Among those are 431 firms above $10B.
          - listitem [ref=f4e92]: "Profit concentration exceeds revenue concentration: the top 100 firms capture 43.6% of all profit versus 35.4% of revenue."
