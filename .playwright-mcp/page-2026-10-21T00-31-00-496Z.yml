        - 'heading "07 Time series: how the picture changed" [level=2] [ref=f45e6437]':
          - generic [ref=f45e6438]: "07"
          - text: "Time series: how the picture changed"
        - paragraph [ref=f45e6439]: "The tracked cohort across years: revenue and profit paths, where the profit pool moved, and which firms climbed."
        - heading "What the data shows" [level=3] [ref=f45e6440]
        - list [ref=f45e6441]:
          - listitem [ref=f45e6442]: "Constant cohort: 1,287 firms, 2015–2024. Aggregate revenue grew from $29.34T to $45.22T — ×1.54, a CAGR of 4.9% (95% CI 3.3–4.9%)."
          - listitem [ref=f45e6443]: Profit outran revenue. Over the same window the cohort's profit pool grew ×1.95 against revenue ×1.54 — so the blended margin widened, not narrowed.
          - listitem [ref=f45e6444]: "The profit pool migrated. Biggest share gainers: Oil & Gas Operations (+7.5pp), IT Software & Services (+4.0pp), Materials (+3.9pp), Semiconductors (+1.4pp), Retail and Wholesale (+1.2pp)."
          - listitem [ref=f45e6445]: "Biggest share losers: Banking (-5.3pp), Consumer Durables (-2.9pp), Drugs & Biotechnology (-2.8pp), Telecommunications Services (-2.5pp), Food, Drink & Tobacco (-1.6pp)."
          - listitem [ref=f45e6446]: The top of the table is sticky but not static. Of the top 100 in 2015, 67 are still there today; of the top 500, 382 remain (76.4%).
          - listitem [ref=f45e6447]: Of 1,287 current Forbes firms with a full history, 15% shrank over the decade (median growth +51.8%).
