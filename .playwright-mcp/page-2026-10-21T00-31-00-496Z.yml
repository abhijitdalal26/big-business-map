          - listitem [ref=f45e7843]: Every company carries a confidence score (median 0.60, 10th percentile 0.40), derived from source trust, how many independent lists corroborate the company, and field completeness.
          - listitem [ref=f45e7844]: The Wikipedia top-up mostly finds companies Forbes missed. 527 of its 1,076 companies are absent from the Forbes 2,000 — which is precisely the coverage gap the reconciled ranking is built to close.
          - listitem [ref=f45e7845]: Read the caveats panel before quoting any single number. Revenue is a flow, not value added; valuations are marks, not prices; and the vintage of every series differs.
