          - listitem [ref=e8814]: "{'topic': 'Unicorn valuations are marks, not prices', 'detail': 'Private valuations are the price of the most recent round, usually preferred stock with a preference. They are not realisable and not comparable to market capitalisation.'}"
          - listitem [ref=e8815]: "{'topic': 'The listed universe is US-complete and world-partial', 'detail': '5,500 US names carry SEC XBRL revenue; the rest carry a market-cap-site estimate. Country counts measure coverage, not corporate density.'}"
          - listitem [ref=e8816]: "{'topic': 'Market-value snapshots come from different dates', 'detail': 'Forbes values are May 2025; the scraped Fortune profiles are dated 2026. They are never plotted on the same axis.'}"
